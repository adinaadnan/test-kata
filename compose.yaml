services:
  db:
    build: ./database
    environment:
      POSTGRES_DB: supportdesk
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: local-workshop-only
    volumes:
      - desk-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U workshop -d supportdesk']
      interval: 2s
      timeout: 2s
      retries: 30
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://workshop:local-workshop-only@db/supportdesk
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health")']
      interval: 3s
      timeout: 3s
      retries: 20
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:8088:80'
    depends_on:
      backend:
        condition: service_healthy
volumes:
  desk-data:
