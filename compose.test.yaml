services:
  db-test:
    build: ./database
    environment:
      POSTGRES_DB: desk_test
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: test-only
    ports:
      - '127.0.0.1:55439:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U workshop -d desk_test']
      interval: 2s
      timeout: 2s
      retries: 30
  backend-tests:
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    environment:
      DATABASE_URL: postgresql://workshop:test-only@db-test/desk_test
    depends_on:
      db-test:
        condition: service_healthy
    volumes:
      - ./coverage/backend:/reports
